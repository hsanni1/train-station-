<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Ember Halt — Real-time Diorama</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { color: #f5f1e8; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    button { font: inherit; }
    .chrome { transition: opacity .35s ease, transform .35s ease, visibility .35s; }
    #label {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: max(25px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(238, 241, 248, .62);
      font-size: 10px;
      font-weight: 550;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 3;
    }
    #label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e9b96d;
      box-shadow: 0 0 10px rgba(233, 185, 109, .65);
      animation: breathe 3.4s ease-in-out infinite;
    }
    #place {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: max(26px, env(safe-area-inset-left));
      z-index: 3;
      pointer-events: none;
    }
    #place strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .08em;
      color: rgba(248, 241, 224, .88);
    }
    #place span {
      display: block;
      margin-top: 5px;
      color: rgba(208, 216, 232, .38);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    #hint {
      position: fixed;
      left: max(26px, env(safe-area-inset-left));
      bottom: max(27px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 3;
      color: rgba(218, 224, 237, .34);
      font-size: 10px;
      letter-spacing: .05em;
      pointer-events: none;
    }
    #controls {
      position: fixed;
      left: 50%;
      bottom: max(20px, calc(env(safe-area-inset-bottom) + 10px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 17px;
      background: rgba(18, 21, 27, .58);
      box-shadow: 0 12px 45px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .055);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      z-index: 5;
    }
    .icon-button {
      width: 41px;
      height: 41px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 11px;
      color: rgba(239, 241, 246, .68);
      background: transparent;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-button:hover { color: #fff8e9; background: rgba(255, 255, 255, .075); }
    .icon-button:active { transform: scale(.92); }
    .icon-button:focus-visible { outline: 2px solid rgba(233, 185, 109, .8); outline-offset: 2px; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .divider { width: 1px; height: 19px; margin: 0 3px; background: rgba(255, 255, 255, .09); }
    #pause .play-icon, #pause.paused .pause-icon { display: none; }
    #pause.paused .play-icon { display: block; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: max(87px, calc(env(safe-area-inset-bottom) + 77px));
      transform: translate(-50%, 7px);
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      background: rgba(13, 16, 21, .7);
      color: rgba(246, 241, 229, .72);
      font-size: 10px;
      letter-spacing: .06em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 6;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #restore {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 8px));
      z-index: 7;
      opacity: 0;
      visibility: hidden;
      background: rgba(15, 18, 24, .35);
      border: 1px solid rgba(255, 255, 255, .08);
      backdrop-filter: blur(12px);
    }
    body.clean .chrome { opacity: 0; visibility: hidden; pointer-events: none; }
    body.clean #restore { opacity: .32; visibility: visible; }
    body.clean #restore:hover { opacity: 1; }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      background: #000;
      transition: opacity .7s ease, visibility .7s;
    }
    #loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-inner { text-align: center; color: rgba(239, 232, 215, .7); }
    .loader-mark {
      width: 28px;
      height: 28px;
      margin: 0 auto 18px;
      border: 1px solid rgba(233, 185, 109, .18);
      border-top-color: rgba(233, 185, 109, .85);
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    .loader-inner strong { display: block; font-family: Georgia, serif; font-size: 18px; font-weight: 400; letter-spacing: .1em; }
    .loader-inner span { display: block; margin-top: 8px; color: rgba(213, 220, 233, .35); font-size: 9px; letter-spacing: .17em; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { opacity: .4; box-shadow: 0 0 4px rgba(233, 185, 109, .3); } }
    @media (max-width: 650px) {
      #place strong { font-size: 15px; }
      #place span { font-size: 8px; }
      #hint { display: none; }
      #label { top: auto; right: auto; left: max(27px, env(safe-area-inset-left)); bottom: max(86px, calc(env(safe-area-inset-bottom) + 76px)); font-size: 8px; }
      #controls { bottom: max(15px, calc(env(safe-area-inset-bottom) + 7px)); }
      .icon-button { width: 42px; height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chrome, #toast, #loading { transition-duration: .01ms; }
      #label::before, .loader-mark { animation-duration: 3s; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">
    <div class="loader-inner">
      <div class="loader-mark"></div>
      <strong>Ember Halt</strong>
      <span id="load-status">Assembling the miniature</span>
    </div>
  </div>
  <div id="place" class="chrome"><strong>Ember Halt</strong><span>Last train into the blue</span></div>
  <div id="label" class="chrome">Real-time diorama</div>
  <div id="hint" class="chrome">Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click the train for a whistle</div>
  <div id="controls" class="chrome" role="toolbar" aria-label="Diorama controls">
    <button id="reset" class="icon-button" aria-label="Reset camera" title="Reset camera · R">
      <svg viewBox="0 0 24 24"><path d="M4.8 8.3A8 8 0 1 1 4 13"/><path d="M4.8 3.8v4.5h4.5"/></svg>
    </button>
    <button id="pause" class="icon-button" aria-label="Pause animation" aria-pressed="false" title="Pause / play · Space">
      <svg class="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
    </button>
    <button id="capture" class="icon-button" aria-label="Save PNG" title="Capture PNG">
      <svg viewBox="0 0 24 24"><path d="M8.2 5.5 9.5 3.8h5l1.3 1.7H20v13H4v-13Z"/><circle cx="12" cy="11.8" r="3.5"/></svg>
    </button>
    <div class="divider"></div>
    <button id="fullscreen" class="icon-button" aria-label="Toggle fullscreen" title="Fullscreen · F">
      <svg viewBox="0 0 24 24"><path d="M8.5 4H4v4.5M15.5 4H20v4.5M20 15.5V20h-4.5M8.5 20H4v-4.5"/></svg>
    </button>
    <button id="hide" class="icon-button" aria-label="Hide interface" title="Hide interface · H">
      <svg viewBox="0 0 24 24"><path d="M2.8 12s3.2-5.5 9.2-5.5 9.2 5.5 9.2 5.5-3.2 5.5-9.2 5.5S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
  </div>
  <button id="restore" class="icon-button" aria-label="Show interface" title="Show interface · H">
    <svg viewBox="0 0 24 24"><path d="M2.8 12s3.2-5.5 9.2-5.5 9.2 5.5 9.2 5.5-3.2 5.5-9.2 5.5S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
  </button>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    window.addEventListener('error', function () {
      if (!window.dioramaReady) document.getElementById('load-status').textContent = 'Unable to start WebGL — check your connection and graphics support';
    });
    window.addEventListener('unhandledrejection', function () {
      if (!window.dioramaReady) document.getElementById('load-status').textContent = 'Unable to load the scene — please reload to try again';
    });
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    let seed = 0x51f15e;
    const random = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const rand = (min, max) => min + (max - min) * random();
    const pick = values => values[Math.floor(random() * values.length)];
    const clamp = THREE.MathUtils.clamp;
    const TAU = Math.PI * 2;
    const up = new THREE.Vector3(0, 1, 0);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 1);
    renderer.domElement.setAttribute('aria-label', 'Interactive floating island railway diorama');
    renderer.domElement.tabIndex = 0;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .055;
    controls.rotateSpeed = .55;
    controls.zoomSpeed = .7;
    controls.panSpeed = .45;
    controls.enablePan = false;
    controls.minDistance = 13;
    controls.maxDistance = 40;
    controls.minPolarAngle = .18;
    controls.maxPolarAngle = Math.PI * .76;
    controls.autoRotateSpeed = .32;
    controls.target.set(0, -.35, 0);

    const homePosition = new THREE.Vector3();
    const homeTarget = new THREE.Vector3(0, -.35, 0);
    function updateHomePosition() {
      const portraitScale = camera.aspect < 1.15 ? clamp(1.02 / camera.aspect, 1.12, 2.3) : 1;
      homePosition.set(16.8, 13.4, 20.8).multiplyScalar(portraitScale);
      controls.maxDistance = Math.max(40, homePosition.length() * 1.15);
    }
    updateHomePosition();
    camera.position.copy(homePosition);
    controls.target.copy(homeTarget);
    controls.update();

    const renderTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType });
    const composer = new EffectComposer(renderer, renderTarget);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .34, .52, 1.02);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
    const fxaa = new ShaderPass(FXAAShader);
    fxaa.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
    composer.addPass(fxaa);

    const world = new THREE.Group();
    scene.add(world);
    const hemi = new THREE.HemisphereLight(0x8094c7, 0x17121d, 1.45);
    scene.add(hemi);
    const moon = new THREE.DirectionalLight(0x9eb7f2, 2.45);
    moon.position.set(-7, 13, 9);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.left = -11;
    moon.shadow.camera.right = 11;
    moon.shadow.camera.top = 11;
    moon.shadow.camera.bottom = -11;
    moon.shadow.camera.near = 1;
    moon.shadow.camera.far = 35;
    moon.shadow.bias = -.00035;
    moon.shadow.normalBias = .025;
    moon.shadow.radius = 4;
    scene.add(moon);
    const dusk = new THREE.DirectionalLight(0xffb47c, .68);
    dusk.position.set(9, 5, -8);
    scene.add(dusk);

    const standard = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .86, metalness: 0, ...extra });
    const M = {
      grass: standard(0x536343, { flatShading: true }),
      earth: standard(0x554537, { flatShading: true }),
      rock: standard(0x5c5b62, { flatShading: true }),
      rockDark: standard(0x3b3c44, { flatShading: true }),
      stone: standard(0x8a8982, { flatShading: true }),
      stoneLight: standard(0xb0a995, { flatShading: true }),
      plaster: standard(0xd0b994),
      wood: standard(0x493027),
      woodLight: standard(0x79513a),
      sleeper: standard(0x3c2d29),
      roof: standard(0x713b36, { flatShading: true }),
      roofBase: standard(0x472d31),
      iron: standard(0x242931, { metalness: .58, roughness: .48 }),
      rail: standard(0x8b8c91, { metalness: .78, roughness: .32 }),
      brass: standard(0xc69a4a, { metalness: .72, roughness: .3 }),
      green: standard(0x173f35, { metalness: .24, roughness: .48 }),
      greenLight: standard(0x28594a, { metalness: .18, roughness: .5 }),
      black: standard(0x15191d, { metalness: .25, roughness: .58 }),
      cream: standard(0xe3d2ab),
      trunk: standard(0x51382c, { flatShading: true }),
      cat: standard(0xc9854e, { flatShading: true }),
      catDark: standard(0x6b402e, { flatShading: true }),
      window: standard(0xffc06b, { emissive: 0xff8b35, emissiveIntensity: 1.75, roughness: .42 }),
      lamp: standard(0xffd998, { emissive: 0xffa142, emissiveIntensity: 3.1, roughness: .32 }),
      tunnel: new THREE.MeshBasicMaterial({ color: 0x030405, side: THREE.DoubleSide }),
      redSignal: standard(0x4a120d, { emissive: 0xff2818, emissiveIntensity: 3.2 }),
      greenSignal: standard(0x103c24, { emissive: 0x38ff89, emissiveIntensity: .06 })
    };

    const unitBox = new THREE.BoxGeometry(1, 1, 1);
    const ico0 = new THREE.IcosahedronGeometry(1, 0);
    const ico1 = new THREE.IcosahedronGeometry(1, 1);
    const unitCircle = new THREE.CircleGeometry(1, 32);
    const cylinderCache = new Map();
    function cylinderGeometry(top, bottom, height, segments = 10, open = false) {
      const key = `${top}/${bottom}/${height}/${segments}/${open}`;
      if (!cylinderCache.has(key)) cylinderCache.set(key, new THREE.CylinderGeometry(top, bottom, height, segments, 1, open));
      return cylinderCache.get(key);
    }
    function addMesh(geometry, material, parent, x = 0, y = 0, z = 0) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }
    function box(w, h, d, material, parent, x = 0, y = 0, z = 0) {
      const object = addMesh(unitBox, material, parent, x, y, z);
      object.scale.set(w, h, d);
      return object;
    }
    function cylinder(top, bottom, height, material, parent, x = 0, y = 0, z = 0, segments = 10) {
      return addMesh(cylinderGeometry(top, bottom, height, segments), material, parent, x, y, z);
    }
    function orb(radius, material, parent, x = 0, y = 0, z = 0, detail = 1) {
      const object = addMesh(detail ? ico1 : ico0, material, parent, x, y, z);
      object.scale.setScalar(radius);
      return object;
    }
    function beamBetween(a, b, radius, material, parent, segments = 7) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const object = addMesh(cylinderGeometry(radius, radius * 1.08, 1, segments), material, parent);
      object.position.copy(a).add(b).multiplyScalar(.5);
      object.scale.y = direction.length();
      object.quaternion.setFromUnitVectors(up, direction.normalize());
      return object;
    }
    function timberBetween(a, b, width, material, parent) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const object = addMesh(unitBox, material, parent);
      object.position.copy(a).add(b).multiplyScalar(.5);
      object.scale.set(width, direction.length(), width);
      object.quaternion.setFromUnitVectors(up, direction.normalize());
      return object;
    }
    function orientAlong(object, tangent) {
      const z = new THREE.Vector3().crossVectors(tangent, up).normalize();
      const y = new THREE.Vector3().crossVectors(z, tangent).normalize();
      const basis = new THREE.Matrix4().makeBasis(tangent, y, z);
      object.quaternion.setFromRotationMatrix(basis);
    }
    function canvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      draw(canvas.getContext('2d'), width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }
    const softTexture = canvasTexture(64, 64, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(.28, 'rgba(255,255,255,.85)');
      gradient.addColorStop(.65, 'rgba(255,255,255,.22)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });
    function textTexture(text, width = 512, height = 128, fontSize = 54) {
      return canvasTexture(width, height, (ctx, w, h) => {
        ctx.fillStyle = '#33271f';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#b7955e';
        ctx.lineWidth = 5;
        ctx.strokeRect(9, 9, w - 18, h - 18);
        ctx.fillStyle = '#ead9b5';
        ctx.font = `600 ${fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h / 2 + 2);
      });
    }

    const undersidePositions = [];
    const undersideColors = [];
    const rockPalette = [new THREE.Color(0x4a4648), new THREE.Color(0x5c5350), new THREE.Color(0x655a52), new THREE.Color(0x3d4047), new THREE.Color(0x716156)];
    const ringSegments = 32;
    const rings = [];
    const ringSpecs = [
      [6.66, -.43], [6.28, -1.35], [5.25, -2.55], [3.75, -3.75], [2.05, -4.85], [.25, -5.65]
    ];
    const radialNoise = Array.from({ length: ringSegments }, () => rand(.88, 1.08));
    for (let r = 0; r < ringSpecs.length; r++) {
      const ring = [];
      for (let i = 0; i < ringSegments; i++) {
        const angle = i / ringSegments * TAU;
        const radius = ringSpecs[r][0] * 1.23 * radialNoise[i] * rand(.94, 1.05);
        ring.push(new THREE.Vector3(Math.cos(angle) * radius, ringSpecs[r][1] + rand(-.2, .2), Math.sin(angle) * radius));
      }
      rings.push(ring);
    }
    function rockTriangle(a, b, c) {
      const color = pick(rockPalette);
      for (const point of [a, b, c]) {
        undersidePositions.push(point.x, point.y, point.z);
        undersideColors.push(color.r, color.g, color.b);
      }
    }
    for (let r = 0; r < rings.length - 1; r++) {
      for (let i = 0; i < ringSegments; i++) {
        const j = (i + 1) % ringSegments;
        rockTriangle(rings[r][i], rings[r + 1][i], rings[r][j]);
        rockTriangle(rings[r][j], rings[r + 1][i], rings[r + 1][j]);
      }
    }
    const undersideGeometry = new THREE.BufferGeometry();
    undersideGeometry.setAttribute('position', new THREE.Float32BufferAttribute(undersidePositions, 3));
    undersideGeometry.setAttribute('color', new THREE.Float32BufferAttribute(undersideColors, 3));
    undersideGeometry.computeVertexNormals();
    addMesh(undersideGeometry, standard(0xffffff, { vertexColors: true, flatShading: true }), world);
    const islandCap = addMesh(cylinderGeometry(8.45, 8.18, .48, 56), [M.earth, M.grass, M.earth], world, 0, -.24, 0);
    islandCap.receiveShadow = true;

    const patchMaterials = [standard(0x66704a, { flatShading: true }), standard(0x47583d, { flatShading: true }), standard(0x756849, { flatShading: true })];
    for (let i = 0; i < 15; i++) {
      const angle = rand(0, TAU);
      const radius = Math.sqrt(random()) * 7.35;
      const patch = addMesh(unitCircle, pick(patchMaterials), world, Math.cos(angle) * radius, .009 + i * .0002, Math.sin(angle) * radius);
      patch.rotation.x = -Math.PI / 2;
      patch.rotation.z = rand(0, TAU);

    let audioContext;
    let noiseBuffer;
    function whistle() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) { showToast('Web Audio is not supported'); return; }
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') audioContext.resume();
      const now = audioContext.currentTime + .025;
      const master = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2100, now);
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(.19, now + .09);
      master.gain.setValueAtTime(.19, now + .65);
      master.gain.exponentialRampToValueAtTime(.11, now + 1.05);
      master.gain.exponentialRampToValueAtTime(.0001, now + 1.65);
      filter.connect(master);
      master.connect(audioContext.destination);
      const lfo = audioContext.createOscillator();
      const lfoGain = audioContext.createGain();
      lfo.frequency.value = 5.2;
      lfoGain.gain.value = 7;
      lfo.connect(lfoGain);
      lfo.start(now);
      lfo.stop(now + 1.7);
      for (const [frequency, volume] of [[587, .32], [739, .22], [931, .14]]) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(frequency * .96, now);
        oscillator.frequency.exponentialRampToValueAtTime(frequency, now + .12);
        oscillator.frequency.setValueAtTime(frequency, now + 1.1);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * .92, now + 1.6);
        lfoGain.connect(oscillator.frequency);
        gain.gain.value = volume;
        oscillator.connect(gain);
        gain.connect(filter);
        oscillator.start(now);
        oscillator.stop(now + 1.7);
      }
      if (!noiseBuffer) {
        noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const noise = audioContext.createBufferSource();
      const noiseFilter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();
      noise.buffer = noiseBuffer;
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 1050;
      noiseFilter.Q.value = .65;
      noiseGain.gain.setValueAtTime(.045, now);
      noiseGain.gain.exponentialRampToValueAtTime(.0001, now + 1.55);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + 1.65);
      world.updateMatrixWorld(true);
      for (let i = 0; i < 12; i++) emitSteam(true);
      showToast('Steam whistle');
    }

    let paused = false;
    let lastInteraction = performance.now();
    let resetAnimation = null;
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function togglePause() {
      paused = !paused;
      const button = document.getElementById('pause');
      button.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
      showToast(paused ? 'Diorama paused' : 'Diorama playing');
    }
    function resetCamera() {
      updateHomePosition();
      resetAnimation = { elapsed: 0, fromPosition: camera.position.clone(), fromTarget: controls.target.clone() };
      lastInteraction = performance.now();
    }
    function toggleInterface() { document.body.classList.toggle('clean'); }
    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else showToast('Fullscreen is not supported here');
      } catch { showToast('Fullscreen is unavailable'); }
    }
    function capturePNG() {
      composer.render();
      renderer.domElement.toBlob(blob => {
        if (!blob) { showToast('Capture failed — please try again'); return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        link.href = url;
        link.download = `ember-halt-${stamp}.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('PNG captured');
      }, 'image/png');
    }
    document.getElementById('reset').addEventListener('click', resetCamera);
    document.getElementById('pause').addEventListener('click', togglePause);
    document.getElementById('capture').addEventListener('click', capturePNG);
    document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('hide').addEventListener('click', toggleInterface);
    document.getElementById('restore').addEventListener('click', toggleInterface);
    controls.addEventListener('start', () => {
      lastInteraction = performance.now();
      controls.autoRotate = false;
      resetAnimation = null;
    });
    controls.addEventListener('end', () => { lastInteraction = performance.now(); });
    window.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.code === 'Space' && !event.target.closest('button')) { event.preventDefault(); togglePause(); }
      if (event.key.toLowerCase() === 'r') resetCamera();
      if (event.key.toLowerCase() === 'h') toggleInterface();
      if (event.key.toLowerCase() === 'f') toggleFullscreen();
    });
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;
    function setPointer(event) {
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.set((event.clientX - bounds.left) / bounds.width * 2 - 1, -(event.clientY - bounds.top) / bounds.height * 2 + 1);
    }
    function trainHit(event) {
      setPointer(event);
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(trainRoot.children, true).length > 0;
    }
    renderer.domElement.addEventListener('pointerdown', event => { pointerDown = { x: event.clientX, y: event.clientY }; });
    renderer.domElement.addEventListener('pointerup', event => {
      if (pointerDown && Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y) < 6 && trainHit(event)) whistle();
      pointerDown = null;
    });
    let lastHoverCheck = 0;
    renderer.domElement.addEventListener('pointermove', event => {
      if (event.buttons || performance.now() - lastHoverCheck < 90) return;
      lastHoverCheck = performance.now();
      renderer.domElement.style.cursor = trainHit(event) ? 'pointer' : 'grab';
    });
    renderer.domElement.addEventListener('pointerleave', () => { pointerDown = null; });

    function updateFallingLeaves(time) {
      const span = 5.3;
      for (let i = 0; i < fallingLeafCount; i++) {
        const leaf = leafData[i];
        const y = .12 + ((leaf.offset - time * leaf.speed) % span + span) % span;
        const drift = (span - y) * .07;
        dummy.position.set(-4.25 + leaf.x + Math.sin(time * .7 + leaf.phase) * .42 + drift, y, -3.05 + leaf.z + Math.cos(time * .53 + leaf.phase) * .38);
        dummy.rotation.set(time * .8 + leaf.phase, time * .43 + leaf.phase, Math.sin(time + leaf.phase) * .8);
        dummy.scale.setScalar(leaf.scale);
        dummy.updateMatrix();
        fallingLeaves.setMatrixAt(i, dummy.matrix);
      }
      fallingLeaves.instanceMatrix.needsUpdate = true;
    }
    function updateFireflies(time) {
      for (let i = 0; i < fireflyCount; i++) {
        const fly = fireflyData[i];
        fireflyPositions[i * 3] = fly.x + Math.sin(time * fly.speed + fly.phase) * .42;
        fireflyPositions[i * 3 + 1] = fly.y + Math.sin(time * fly.speed * .73 + fly.phase) * .28;
        fireflyPositions[i * 3 + 2] = fly.z + Math.cos(time * fly.speed * .61 + fly.phase) * .4;
      }
      fireflyGeometry.attributes.position.needsUpdate = true;
      fireflyMaterial.opacity = .76 + Math.sin(time * 1.7) * .12;
    }
    function updateSteam(dt) {
      for (const particle of steamParticles) {
        if (particle.life <= 0) continue;
        particle.life -= dt;
        if (particle.life <= 0) { particle.sprite.visible = false; continue; }
        const age = 1 - particle.life / particle.maxLife;
        particle.sprite.position.addScaledVector(particle.velocity, dt);
        particle.velocity.x += dt * .025;
        particle.sprite.scale.setScalar(.22 + age * 1.15);
        particle.sprite.material.opacity = (1 - age) * (1 - age) * .58;
        particle.sprite.material.rotation += particle.spin * dt;
      }
    }
    function updateEnvironment(time) {
      world.position.y = Math.sin(time * .4) * .16;
      for (const rock of orbitRocks) {
        const angle = rock.angle + time * rock.speed;
        rock.object.position.set(Math.cos(angle) * rock.radius, rock.y + Math.sin(time * .3 + rock.phase) * .25, Math.sin(angle) * rock.radius);
        rock.object.rotation.set(time * .08 + rock.phase, time * .11, time * .05);
      }
      updateFallingLeaves(time);
      updateFireflies(time);
      if (sleepingCat) sleepingCat.scale.y = 1 + Math.sin(time * 2.1) * .022;
    }
    function updateLamps(time, arrival) {
      const flicker = 1 + Math.sin(time * 15.7) * .025 + Math.sin(time * 27.3) * .018;
      for (const lamp of lampLights) lamp.light.intensity = lamp.base * (1 + arrival * .38) * (flicker + Math.sin(time * 19 + lamp.phase) * .018);
      M.lamp.emissiveIntensity = (3.05 + arrival * .85) * flicker;
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      fxaa.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
        composer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
        fxaa.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
        updateHomePosition();
      }, 100);
    });

    let previousTime = performance.now();
    let simulationTime = 0;
    let rendered = false;
    updateEnvironment(0);
    const initialArrival = updateTrain(0);
    updateLamps(0, initialArrival);
    function animate(now) {
      requestAnimationFrame(animate);
      const realDt = Math.min((now - previousTime) / 1000, .05);
      previousTime = now;
      const dt = paused ? 0 : realDt;
      if (dt > 0) {
        simulationTime += dt;
        updateEnvironment(simulationTime);
        const arrival = updateTrain(dt);
        updateLamps(simulationTime, arrival);
        updateSteam(dt);
      }
      if (resetAnimation) {
        resetAnimation.elapsed += realDt;
        const progress = clamp(resetAnimation.elapsed / 1.15, 0, 1);
        const eased = progress * progress * (3 - 2 * progress);
        camera.position.lerpVectors(resetAnimation.fromPosition, homePosition, eased);
        controls.target.lerpVectors(resetAnimation.fromTarget, homeTarget, eased);
        if (progress >= 1) resetAnimation = null;
      }
      controls.autoRotate = !paused && !resetAnimation && now - lastInteraction > 4800;
      controls.update();
      composer.render();
      if (!rendered) {
        rendered = true;
        window.dioramaReady = true;
        document.getElementById('loading').classList.add('done');
      }
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
